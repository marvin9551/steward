name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . ruff
      - name: Lint
        run: ruff check steward tests
      - name: Tests
        run: python -m unittest discover -s tests -v
