[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "steward"
version = "0.1.0"
description = "A small, auditable personal agent you can read end to end"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.scripts]
steward = "steward.cli:main"

[tool.setuptools.packages.find]
include = ["steward*"]

# The built single page ships inside the package, so `pip install` alone is
# enough to run `steward web` without a Node toolchain.
[tool.setuptools.package-data]
steward = ["web/static/*", "web/static/assets/*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501"]
